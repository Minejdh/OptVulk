plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'  // Latest recommended
    id 'maven-publish'
}

version = mod_version
group = maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${mappings_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    
    // VulkanMod core dependencies (you'll keep these from original)
    include "org.lwjgl:lwjgl-vulkan:3.3.3"
    // Add more LWJGL Vulkan modules as needed
}

// Multi-version friendly fabric.mod.json handling
tasks.processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21   // Java 21 recommended for 1.21+
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
